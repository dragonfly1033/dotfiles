# Get editor completions based on the config schema
"$schema" = 'https://starship.rs/config-schema.json'

profiles.transient = """$character"""

right_format = "$cmd_duration"

# Which is equivalent to
format = """
╭╴  $username\
$hostname\
$localip\
$shlvl\
$directory\
$git_branch\
$git_commit\
$git_status\
$git_state\
$git_metrics\
$kubernetes\
$docker_context\
$env_var\
$custom\
$sudo\
$line_break\
╰─$character"""

scan_timeout = 100

add_newline = false

git_metrics.disabled = true

[sudo]
disabled = true
symbol = "√ "
style = "bold red"
format = "[$symbol]($style)"

[git_status]
stashed = '[*$count](green)'
staged = '[+$count](yellow)'
modified = '[!$count](orange)'
deleted = '[✗$count](red)'
ahead = '[⇡$count](green)'
behind = '[⇣$count](red)'
diverged = '[⇕\($ahead_count, $behind_count\)](red)'
untracked = '[?$count](red)'
renamed = '[»$count](red)'
conflicted = '[~$count](red)'