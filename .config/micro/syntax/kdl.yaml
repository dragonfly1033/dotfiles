filetype: prolog

detect:
    filename: "\\.kdl$"
    signature: "^%.*$"

rules:
    - comment:
        start: "//"
        end: "$"    

    - constant.string: 
        start: "\""
        end: "\""
        rules:
            - constant.string: "[^\"]*"
    
    - constant.string:
        start: "\""
        end: "(\"|$)"
        skip: "\\\\."
        rules:
            - constant.specialChar: "\\\\."

    - identifier: "^[ ]*([a-zA-Z][a-zA-Z_0-9-]+).*$"
    - constant.number: "-?[0-9]+\\.?[0-9]*"
    - constant.bool: "(true|false)"

    - symbol.brackets: "(\\[|\\]|{|}|\\+|=|;)"


